<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="description" content="Form Lab — 上传跑姿视频，对比参考跑姿，获得清晰的改进建议。" />
    <meta name="theme-color" content="#142018" />
    <title>Form Lab</title>
    <link rel="stylesheet" crossorigin href="./assets/index-Dqa7GFbi.css" />
    <link rel="stylesheet" href="./layout.css" />
    <script type="module" crossorigin src="./assets/index-Dque4xwz.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // ---- 诊断层：捕获所有报错并直接显示在页面上（移动端无需开发者工具）----
      (function () {
        var shown = 0;
        function show(title, detail) {
          shown++;
          var badge = document.querySelector('.dbg-badge') || (function () {
            var b = document.createElement('div');
            b.className = 'dbg-badge';
            document.body.appendChild(b);
            return b;
          })();
          badge.style.display = 'block';
          badge.textContent = '⚠ 已捕获 ' + shown + ' 个错误';
          var old = document.querySelector('.err-toast');
          if (old) old.remove();
          var t = document.createElement('div');
          t.className = 'err-toast';
          var s = document.createElement('strong');
          s.textContent = title;
          var d = document.createElement('span');
          d.className = 'err-detail';
          d.textContent = (detail || '').slice(0, 400);
          var close = document.createElement('button');
          close.textContent = '我知道了';
          close.onclick = function () { t.remove(); badge.style.display = 'none'; };
          t.appendChild(s); t.appendChild(d); t.appendChild(close);
          document.body.appendChild(t);
        }
        window.addEventListener('error', function (e) {
          show('页面脚本出错', (e.message || '') + '\n@ ' + (e.filename || '').split('/').pop() + ':' + (e.lineno || ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason || {};
          // getUserMedia 的权限拒绝由下面的友好提示负责，避免重复弹
          if (r && (r.name === 'NotAllowedError' || r.name === 'NotFoundError')) return;
          show('异步操作失败', (r && (r.stack || r.message)) || String(e.reason));
        });
        // 摄像头：约束不满足时自动降级重试，避免直接失败
        var origGUM = navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
        if (origGUM) {
          navigator.mediaDevices.getUserMedia = function (constraints) {
            var call = function (c) {
              return origGUM.call(navigator.mediaDevices, c);
            };
            var audio = constraints && constraints.audio ? constraints.audio : false;

            return call(constraints).catch(function (err) {
              // 只对「设备不匹配」类错误降级，权限拒绝不该重试
              if (err.name !== 'NotFoundError' && err.name !== 'OverconstrainedError' &&
                  err.name !== 'NotReadableError' && err.name !== 'TypeError') {
                return Promise.reject(err);
              }
              var retries = [
                // 1) 去掉 facingMode，只要求基础分辨率
                { audio: audio, video: { width: { ideal: 640 }, height: { ideal: 480 } } },
                // 2) 只要视频，最宽松约束
                { audio: audio, video: true },
                // 3) 逐个尝试系统枚举到的设备
                function () {
                  return navigator.mediaDevices.enumerateDevices().then(function (ds) {
                    var cams = ds.filter(function (d) { return d.kind === 'videoinput'; });
                    return cams.reduce(function (p, d) {
                      return p.catch(function () {
                        return call({ audio: audio, video: { deviceId: { exact: d.deviceId } } });
                      });
                    }, Promise.reject(new Error('no camera')));
                  });
                }
              ];

              var next = function (i) {
                if (i >= retries.length) {
                  var map = {
                    NotAllowedError: ['相机权限被拒绝', '请在 Safari 地址栏左侧的「aA」→「网站设置」→ 相机 改为「允许」，然后刷新页面重试。'],
                    NotFoundError: ['这台设备没有可用的摄像头', '浏览器没有检测到任何摄像头。可以改用「选视频」— 从相册选一段 3–8 秒的侧身跑姿视频，分析效果完全相同。'],
                    NotReadableError: ['相机被其他应用占用', '请关闭正在使用相机的 App（如相机、微信、视频会议），然后重试。'],
                    OverconstrainedError: ['摄像头规格不匹配', '已尝试全部可用摄像头仍无法启动，请改用「选视频」上传。']
                  };
                  var m = map[err.name] || ['相机启动失败', '建议改用「选视频」上传一段 3–8 秒的侧身跑姿视频，效果相同。'];
                  show(m[0], m[1] + '\n[' + err.name + ']');
                  return Promise.reject(err);
                }
                var r = retries[i];
                var attempt = typeof r === 'function' ? r() : call(r);
                return attempt.catch(function () { return next(i + 1); });
              };
              return next(0);
            });
          };
        }
      })();

      // 首屏布局增强：拍摄指南折叠收起，操作按钮常驻视口底部
      (function () {
        function enhance() {
          var guide = document.querySelector('.capture-guide');
          var actions = document.querySelector('.actions');
          if (!guide || !actions || guide.dataset.folded) return false;

          // 1) 拍摄指南折叠为 details，默认收起
          var wrap = document.createElement('details');
          wrap.className = 'guide-fold';
          var summary = document.createElement('summary');
          summary.textContent = '查看拍摄要点';
          var count = guide.querySelectorAll('.guide-dont figure').length;
          if (count) {
            var badge = document.createElement('span');
            badge.className = 'guide-fold-badge';
            badge.textContent = count + ' 条建议';
            summary.appendChild(badge);
          }
          wrap.appendChild(summary);

          guide.parentNode.insertBefore(wrap, guide);
          wrap.appendChild(guide);
          guide.dataset.folded = '1';

          // 2) 操作按钮变成底部悬浮栏
          var dock = document.createElement('div');
          dock.className = 'action-dock';
          actions.parentNode.insertBefore(dock, actions);
          dock.appendChild(actions);

          document.body.classList.add('has-dock');
          return true;
        }

        // 等 React 挂载完成再接管
        var tries = 0;
        var timer = setInterval(function () {
          if (enhance() || ++tries > 100) clearInterval(timer);
        }, 100);
      })();
    </script>
  </body>
</html>
